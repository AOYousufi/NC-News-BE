name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      JWT_SECRET: github-actions-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set up databases
        run: npm run setup-dbs

      - name: Seed development database
        run: npm run seed
        env:
          NODE_ENV: development
          PGDATABASE: nc_news

      - name: Verify migrations
        run: npm run migrate
        env:
          NODE_ENV: development
          PGDATABASE: nc_news

      - name: Verify migrations are idempotent
        run: npm run migrate
        env:
          NODE_ENV: development
          PGDATABASE: nc_news

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          PGDATABASE: nc_news_test
